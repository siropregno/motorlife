<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="car-card-container">
        <div class="car-card">

            <div class="card-label epic"></div>

            <div class="card-logo">
              <img src="bmw-logo.png" alt="BMW">
            </div>

            <div class="card-info">
                <h2 class="card-title-bold">M5 E60 <span class="card-title-light">'05</span></h2>
                <p class="card-text-light">507 Hp / 520 Nm</p>
                <p class="card-text-light">Super Sedán</p>
            </div>

            <div class="card-car">
                <img src="bmw-m5-e60.png" alt="BMW M5 E60">
            </div>

        </div>

        <div class="car-card">

            <div class="card-label common"></div>

            <div class="card-logo">
              <img src="renault-logo.png" alt="Renault">
            </div>

            <div class="card-info">
                <h2 class="card-title-bold">R12 TL <span class="card-title-light">'71</span></h2>
                <p class="card-text-light">54 Hp / 94 Nm</p>
                <p class="card-text-light">Compacto</p>
            </div>

            <div class="card-car">
                <img src="renault-12.png" alt="Renault R12">
            </div>

        </div>
        
        <div class="car-card">

            <div class="card-label common"></div>

            <div class="card-logo">
              <img src="peugeot-logo.png" alt="Peugeot">
            </div>

            <div class="card-info">
                <h2 class="card-title-bold">504 TN <span class="card-title-light">'77</span></h2>
                <p class="card-text-light">110 Hp / 166 Nm</p>
                <p class="card-text-light">Sedán deportivo</p>
            </div>

            <div class="card-car">
                <img src="peugeot-504.png" alt="Peugeot 504">
            </div>

        </div>

        <div class="car-card">
            <div class="card-label common"></div>

            <div class="card-logo">
              <img src="ford-logo.png" alt="Ford">
            </div>

            <div class="card-info">
                <h2 class="card-title-bold">F-100 <span class="card-title-light">'79</span></h2>
                <p class="card-text-light">116 Hp / 310 Nm</p>
                <p class="card-text-light">Pickup</p>
            </div>

            <div class="card-car">
                <img src="ford-f-100.png" alt="Ford F-100">
            </div>

        </div>
    </div>
</body>
</html>
